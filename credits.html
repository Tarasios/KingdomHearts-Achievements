<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Credits • KH Completionist</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<!--
    Credits page. Lists the community guides and resources the trackers
    were built from. External links open in a new tab. All visible text
    lives in lang/messages/<lang>/credits.json; the link URLs are the only
    hardcoded part (i18n only ever sets text, never href).
-->
<body data-page="credits" data-root="./">
    <!-- Header nav is built by js/nav.js: one shared menu definition for every page. -->
    <nav id="site-nav"></nav>

    <div class="container">
        <section class="project-hero">
            <h1 id="credits-title"></h1>
            <p id="credits-subtitle"></p>
        </section>

        <main class="main-content">
            <section class="section">
                <h2 id="credits-resources-label"></h2>
                <p class="credits-intro" id="credits-intro"></p>

                <div class="project-grid">
                    <a class="project-card" href="https://www.khwiki.com/" target="_blank" rel="noopener noreferrer">
                        <h3 id="credit-khwiki-name"></h3>
                        <p id="credit-khwiki-desc"></p>
                        <div class="project-meta">
                            <span class="tech-tag">khwiki.com</span>
                        </div>
                    </a>

                    <a class="project-card" href="https://gamefaqs.gamespot.com/3ds/997779-kingdom-hearts-3d-dream-drop-distance/faqs/64749" target="_blank" rel="noopener noreferrer">
                        <h3 id="credit-ddd-gamefaqs-name"></h3>
                        <p id="credit-ddd-gamefaqs-desc"></p>
                        <div class="project-meta">
                            <span class="tech-tag">gamefaqs.gamespot.com</span>
                        </div>
                    </a>

                    <a class="project-card" href="https://xenodusk.carrd.co/" target="_blank" rel="noopener noreferrer">
                        <h3 id="credit-xenodusk-name"></h3>
                        <p id="credit-xenodusk-desc"></p>
                        <div class="project-meta">
                            <span class="tech-tag">xenodusk.carrd.co</span>
                        </div>
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/kh-common.js"></script>
    <script src="js/kh-page.js"></script>
    <script src="js/credits.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
