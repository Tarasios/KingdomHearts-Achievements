<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Kingdom Hearts III Re Mind — Achievement Tracker</title>
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/kh.css">
</head>
<body data-page="kh3-tracker" data-root="../">
    <!-- Header nav is built by js/nav.js: one shared menu definition for every page. -->
    <nav id="site-nav"></nav>

    <div class="container kh">
        <header class="kh-header">
            <figure class="banner kh-logo"><img class="banner-img" id="kh-logo" src="../images/logos/KH3.png" alt=""></figure>
            <h1 id="kh-title"></h1>
            <p class="sub" id="kh-subtitle"></p>
        </header>

        <div class="charbar" id="charbar" style="margin-top:12px">
            <span class="countbadge" style="margin:0" id="playing-as"></span>
            <span class="countbadge" id="overallNote"></span>
        </div>

        <div class="tabs" id="tabs"></div>

        <!-- Tabs and panel contents are built by js/kh-tracker.js from the
             TRACKER_GAME config in the game data module. -->
        <main class="kh-main" id="panels"></main>
    </div>

    <script src="../js/i18n.js"></script>
    <script src="../js/kh-common.js"></script>
    <script src="../js/kh-store.js"></script>
    <script src="../js/kh-counting.js"></script>
    <script src="../js/kh-page.js"></script>
    <script src="../js/kh-widgets.js"></script>
    <script src="../js/kh3-tracker-data.js"></script>
    <script src="../js/kh-tracker.js"></script>
    <script src="../js/kh-progress.js"></script>
    <script src="../js/kh-sync.js"></script>
    <script src="../js/banners.js"></script>
    <script src="../js/nav.js"></script>
</body>
</html>
